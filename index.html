<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d35">
<title>TaxPulse — Your tax year, working for you</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>
<div class="tp-app" id="app">
  <div id="app-content">
    <aside class="tp-sidebar" aria-label="Desktop navigation">
      <div class="tp-brand">
        <span class="tp-brand-mark" data-icon="pulse"></span>
        <span class="tp-brand-word">TaxPulse<span style="color:#92ab7d">.</span></span>
      </div>
      <div class="tp-brand-caption">A Taxfix hackathon concept</div>
      <nav class="tp-side-nav" id="desktop-nav" aria-label="Main navigation"></nav>

      <div class="tp-sidebar-bottom">
        <div class="tp-sidebar-note">
          <span data-icon="sprout"></span>
          <h3 class="tp-mt12">A little now.<br>A lot less later.</h3>
          <p>Your taxes happen all year. Your peace of mind can, too.</p>
          <button class="tp-text-button" data-action="year-end">
            See your year-end map <span data-icon="arrow" class="tp-icon-sm"></span>
          </button>
        </div>
        <div class="tp-sidebar-footer">FICTIONAL DATA · NO SUBMISSIONS</div>
      </div>
    </aside>

    <div class="tp-workspace">
      <header class="tp-topbar">
        <div class="tp-topbar-label">Your space <span aria-hidden="true">/</span> <strong id="breadcrumb">Overview</strong></div>
        <div class="tp-brand tp-topbar-mobile-brand">
          <span class="tp-brand-mark" data-icon="pulse"></span>
          <span>TaxPulse<span style="color:#92ab7d">.</span></span>
        </div>
        <div class="tp-row">
          <span class="tp-badge tp-badge-neutral">2026 · DEMO</span>
          <button class="tp-avatar" data-go="profile" aria-label="Open Alex's demo profile">AK</button>
        </div>
      </header>

      <main class="tp-main" id="main"></main>
    </div>
    <nav class="tp-bottom-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div class="tp-overlay" id="overlay" hidden>
    <section class="tp-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="tp-dialog-heading">
        <h2 id="dialog-title"></h2>
        <button class="tp-close" data-action="close-dialog" aria-label="Close dialog">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="dialog-body"></div>
    </section>
  </div>

  <div class="tp-toast" id="toast" role="status"></div>
  <div class="tp-confetti" id="confetti" aria-hidden="true"></div>
  <div class="tp-sr-only" id="announcer" aria-live="polite"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/screens.js"></script>
<script src="js/flows.js"></script>
<script src="js/app.js"></script>
</body>
</html>
