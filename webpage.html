	
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#004f35">
<title>TaxPulse</title>

<style>
:root {
  color-scheme: light;
  --green: #004f35;
  --green-hover: #086747;
  --mint: #cbefb3;
  --mint-light: #edf6e6;
  --background: #f7f8f3;
  --surface: #ffffff;
  --ink: #202820;
  --muted: #737c71;
  --border: #e4e8de;
  --purple: #eee9f7;
  --purple-ink: #725889;
  --radius: 22px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button, input, select { -webkit-tap-highlight-color: transparent; }

button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #9c80c0;
  outline-offset: 4px;
}

[hidden] { display: none !important; }

h1, h2, h3, p { margin: 0; }
h1 { font-size: 34px; line-height: 1.13; letter-spacing: -1.3px; }
h2 { font-size: 21px; line-height: 1.25; letter-spacing: -.6px; }
h3 { font-size: 14px; line-height: 1.4; }
p { color: var(--muted); }

.icon {
  display: block;
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.icon-small { width: 16px; height: 16px; }

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 230px;
  padding: 35px 22px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1.4px;
  color: var(--green);
}

.brand-symbol {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--green);
  color: var(--mint);
}

.brand-symbol .icon { width: 23px; height: 23px; }

.sidebar-nav {
  display: grid;
  gap: 7px;
  margin-top: 47px;
}

.sidebar-nav button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 13px;
  color: var(--muted);
  background: transparent;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
}

.sidebar-nav button[aria-current="page"] {
  color: var(--green);
  background: var(--mint-light);
}

.sidebar-bottom { margin-top: auto; }

.sidebar-bottom p {
  font-size: 13px;
  line-height: 1.6;
  max-width: 155px;
}

.workspace { margin-left: 230px; }

.topbar {
  height: 86px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  border-bottom: 1px solid var(--border);
}

.breadcrumb { color: var(--muted); font-size: 12px; }
.mobile-brand { display: none; }

.avatar {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: #e8eddf;
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
}

.main { max-width: 1160px; margin: auto; padding: 35px 40px 50px; }
.page { animation: enter .25s ease both; }

.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 27px;
}

.page-heading p { margin-top: 10px; font-size: 13px; }

.eyebrow {
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; }
.stack { display: grid; align-content: start; gap: 18px; }
.flow { max-width: 490px; margin: auto; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.start { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.small { font-size: 12px; }
.tiny { font-size: 10px; }
.center { text-align: center; }
.muted { color: var(--muted); }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.mt20 { margin-top: 20px; }
.mt24 { margin-top: 24px; }

.card {
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.card-green { background: var(--mint-light); border-color: #e0ebd5; }
.card-purple { background: var(--purple); border-color: #e4dcee; }

.icon-box {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 14px;
  color: var(--green);
  background: #f0f4e9;
}

.icon-box-purple { color: var(--purple-ink); background: var(--purple); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 100px;
  padding: 5px 9px;
  font-size: 10px;
  font-weight: 600;
  color: #517342;
  background: #eff5e8;
}

.badge .icon { width: 12px; height: 12px; }
.badge-light { color: #dbefcf; background: #ffffff16; }

.button {
  min-height: 49px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 13px;
  font-weight: 700;
  color: white;
  background: var(--green);
  transition: background .15s, transform .15s;
}

.button:hover { background: var(--green-hover); }
.button:active { transform: scale(.98); }
.button-full { width: 100%; }
.button-light { color: var(--green); background: var(--mint); }
.button-light:hover { background: #bce39f; }
.button-secondary { color: var(--green); background: #edf2e6; }
.button-secondary:hover { background: #e2ebd9; }

.text-button {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  background: transparent;
  color: var(--green);
  padding: 8px 0;
  font-size: 12px;
  font-weight: 600;
}

.back { margin-bottom: 10px; color: var(--muted); }

.hero {
  position: relative;
  overflow: hidden;
  padding: 27px;
  border-radius: 25px;
  background: var(--green);
  color: white;
}

.hero-circle {
  position: absolute;
  right: -64px;
  top: -82px;
  width: 240px;
  height: 240px;
  border: 1px solid #ffffff12;
  border-radius: 50%;
  pointer-events: none;
}

.hero-circle::after {
  content: "";
  position: absolute;
  inset: 27px;
  border: 1px solid #ffffff12;
  border-radius: 50%;
}

.hero-label { font-size: 13px; font-weight: 600; color: #ecf7e6; }

.hero-amount {
  margin-top: 22px;
  color: var(--mint);
  font-size: 83px;
  font-weight: 700;
  letter-spacing: -5px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.hero-unit { color: #d1e3c8; font-size: 17px; letter-spacing: -.4px; font-weight: 400; }
.hero-copy { margin-top: 10px; color: #c4d7bc; font-size: 12px; }

.hero-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-top: 27px;
  padding-top: 21px;
  border-top: 1px solid #ffffff20;
}

.hero-annual { font-size: 23px; letter-spacing: -.8px; font-weight: 600; }
.hero-caption { margin-top: 4px; color: #bdd1b5; font-size: 10px; }

.amount {
  font-size: 48px;
  line-height: 1.18;
  font-weight: 700;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}

.treasure-value { margin-top: 16px; font-size: 58px; letter-spacing: -3px; }

.divider { height: 1px; background: var(--border); margin: 20px 0; }

.progress {
  overflow: hidden;
  height: 7px;
  border-radius: 100px;
  background: #dfe8d6;
}

.progress span {
  display: block;
  height: 100%;
  width: var(--progress);
  border-radius: inherit;
  background: var(--green);
  transition: width .7s ease;
}

.ring { position: relative; width: 74px; height: 74px; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: #dce7d2; stroke-width: 5; }
.ring-fill { fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round; }
.ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { padding: 15px; background: #f7f8f3; border-radius: 13px; }
.stat span { display: block; color: var(--muted); font-size: 10px; }
.stat strong { display: block; font-size: 21px; margin-top: 5px; letter-spacing: -.6px; }

.check-line { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 13px; }
.check-line .icon { color: #608348; width: 16px; height: 16px; }

.receipt-row { display: flex; align-items: center; gap: 12px; padding: 16px 0; }
.receipt-row + .receipt-row { border-top: 1px solid var(--border); }
.receipt-row strong { font-size: 12px; }
.receipt-row p { margin-top: 4px; font-size: 10px; }
.receipt-value { text-align: right; }
.receipt-value strong { font-size: 15px; }
.receipt-value small { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }

.capture {
  padding: 28px 20px;
  border: 1px dashed #b5cda6;
  border-radius: 20px;
  background: #f3f8ed;
  text-align: center;
}

.capture-icon {
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  color: var(--mint);
  background: var(--green);
  border-radius: 22px;
}

.capture-icon .icon { width: 29px; height: 29px; }

.scan-window {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 310px;
  padding: 27px;
  overflow: hidden;
  border: 1px solid #dce5d4;
  border-radius: 22px;
  background: #e9f0e2;
}

.receipt-paper {
  width: 210px;
  padding: 25px 20px;
  background: #fffef9;
  transform: rotate(-4deg);
  box-shadow: 0 12px 25px #173d3514;
  font-family: monospace;
  font-size: 11px;
}

.receipt-paper-title { font-size: 19px; text-align: center; font-weight: 700; }
.receipt-rule { border-top: 1px dashed #cbd0c0; margin: 17px 0; }

.barcode {
  height: 27px;
  width: 125px;
  margin: 23px auto 0;
  background: repeating-linear-gradient(90deg,#324331 0 2px,transparent 2px 4px,#324331 4px 5px,transparent 5px 8px);
}

.scan-line {
  position: absolute;
  left: 20px;
  right: 20px;
  top: 35px;
  height: 2px;
  background: #7cad61;
  box-shadow: 0 0 20px #80a86b90;
  animation: scan 2s ease-in-out infinite alternate;
}

.agent-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 0;
  font-size: 12px;
}

.agent-row + .agent-row { border-top: 1px solid var(--border); }
.agent-status { margin-left: auto; color: #799065; font-size: 10px; }
.agent-active { color: var(--purple-ink); }

.impact {
  padding: 28px 20px;
  border-radius: 22px;
  color: white;
  background: var(--green);
  text-align: center;
}

.impact p { color: #c8d9bf; }
.impact .amount { color: var(--mint); font-size: 65px; margin-top: 12px; }

.details { background: white; border: 1px solid var(--border); border-radius: 15px; padding: 0 17px; }
.details summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 53px; cursor: pointer; list-style: none; font-size: 12px; font-weight: 600; }
.details summary::-webkit-details-marker { display: none; }
.details p { padding-bottom: 17px; font-size: 12px; line-height: 1.7; }

.field-label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 600; }
.input { width: 100%; min-height: 47px; border: 1px solid #dbe3d4; border-radius: 12px; background: #fafbf7; color: var(--ink); padding: 12px; }
.checkbox-row { display: flex; align-items: flex-start; gap: 9px; margin-top: 17px; font-size: 11px; color: var(--muted); }
.checkbox-row input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--green); flex-shrink: 0; }

.success-symbol { width: 70px; height: 70px; display: grid; place-items: center; border-radius: 50%; background: var(--mint); color: var(--green); margin: 0 auto 20px; }
.success-symbol .icon { width: 32px; height: 32px; }

.months { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; }
.month { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 11px; background: #f3f5ed; color: #99a18f; font-size: 9px; }
.month-done { background: #e9f3de; color: var(--green); }
.month .icon { width: 14px; height: 14px; }

.disclaimer { margin-top: 14px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.footer-link { margin-top: 23px; }
.footer-link .text-button { font-size: 10px; color: #87917e; }

.bottom-nav { display: none; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #142d2459;
  backdrop-filter: blur(3px);
}

.dialog {
  width: 100%;
  max-width: 470px;
  max-height: 88dvh;
  overflow-y: auto;
  border-radius: 25px;
  padding: 25px;
  background: var(--background);
  box-shadow: 0 20px 70px #173d3530;
  animation: enter .22s ease both;
}

.dialog-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 18px; }
.dialog-header h2 { padding-top: 4px; }
.close { width: 34px; height: 34px; display: grid; place-items: center; flex-shrink: 0; border: 0; border-radius: 50%; background: #e9eee2; color: var(--green); }
.dialog p { font-size: 12px; line-height: 1.7; }
.dialog ul { padding-left: 18px; color: var(--muted); font-size: 12px; }
.dialog li { margin-bottom: 10px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  z-index: 150;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 14px 19px;
  border-radius: 13px;
  background: var(--green);
  color: white;
  font-size: 12px;
  box-shadow: 0 6px 25px #173d3520;
  opacity: 0;
  transform: translate(-50%,12px);
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}

.toast-visible { opacity: 1; transform: translate(-50%,0); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

@keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scan { to { top: calc(100% - 35px); } }

@media (max-width: 1100px) {
  .sidebar { width: 195px; padding-left: 17px; padding-right: 17px; }
  .workspace { margin-left: 195px; }
  .main { padding: 30px 25px; }
  .topbar { padding: 0 25px; }
  .grid { gap: 16px; grid-template-columns: 1.1fr 1fr; }
  .hero-amount { font-size: 70px; }
  .hero { padding: 23px; }
}

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .sidebar { width: 82px; padding: 30px 12px; }
  .sidebar .brand { justify-content: center; }
  .sidebar .brand-word, .nav-label, .sidebar-bottom { display: none; }
  .sidebar-nav button { justify-content: center; padding: 15px 10px; }
  .workspace { margin-left: 82px; }
}

@media (max-width: 600px) {
  .sidebar { display: none; }
  .workspace { margin-left: 0; }
  .topbar { height: 72px; padding: 0 21px; border-bottom: 0; }
  .breadcrumb { display: none; }
  .mobile-brand { display: flex; font-size: 25px; }
  .main { padding: 19px 20px 105px; }
  .page-heading { margin-bottom: 23px; }
  h1 { font-size: 29px; letter-spacing: -1.1px; }
  .page-heading p { font-size: 12px; }
  .heading-action { display: none; }
  .hero { padding: 24px; }
  .hero-amount { font-size: 76px; }
  .hero-unit { font-size: 15px; }
  .hero-bottom .button { font-size: 11px; padding: 10px 12px; min-height: 43px; }
  .hero-annual { font-size: 22px; }
  .card { padding: 21px; }
  .bottom-nav {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    background: #fffffff5;
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 8px 6px max(9px,env(safe-area-inset-bottom));
  }
  .bottom-nav button {
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 5px;
    min-height: 51px;
    padding: 3px 0;
    border: 0;
    color: #8b9383;
    background: transparent;
    font-size: 9px;
  }
  .bottom-nav .nav-label { display: block; }
  .bottom-nav .nav-icon { padding: 4px 15px; border-radius: 10px; }
  .bottom-nav button[aria-current="page"] { color: var(--green); font-weight: 700; }
  .bottom-nav button[aria-current="page"] .nav-icon { background: #eaf3e0; }
  .overlay { align-items: flex-end; padding: 25px 0 0; }
  .dialog { max-width: none; max-height: 90dvh; border-radius: 25px 25px 0 0; padding: 24px 22px max(26px,env(safe-area-inset-bottom)); }
  .toast { bottom: 91px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<body>
<div id="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-symbol" data-icon="pulse"></span>
      <span class="brand-word">TaxPulse</span>
    </div>
    <nav id="desktop-nav" class="sidebar-nav" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">
      <p>Your tax year.<br>A little clearer, every day.</p>
      <button class="text-button" data-action="estimates">How estimates work</button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <span class="breadcrumb" id="breadcrumb">Overview</span>
      <div class="brand mobile-brand">
        <span class="brand-symbol" data-icon="pulse"></span>
        <span>TaxPulse</span>
      </div>
      <button class="avatar" data-go="profile" aria-label="Open Alex’s profile">AK</button>
    </header>
    <main class="main" id="main"></main>
  </div>

  <nav id="mobile-nav" class="bottom-nav" aria-label="Mobile navigation"></nav>
</div>

<div class="overlay" id="overlay" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h2 id="dialog-title"></h2>
      <button class="close" data-action="close" aria-label="Close dialog">
        <span data-icon="close"></span>
      </button>
    </div>
    <div id="dialog-body"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>
<div id="announcer" class="sr-only" aria-live="polite"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const euro = value => new Intl.NumberFormat('en-IE', {
  style: 'currency', currency: 'EUR', maximumFractionDigits: 0
}).format(value);

const paths = {
  pulse: '<path d="M2 12h5l3-7 4 14 3-7h5"/>',
  home: '<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',
  receipt: '<path d="M5 3h14v18l-3-2-4 2-4-2-3 2z"/><path d="M8 7h8M8 11h8M8 15h4"/>',
  plus: '<rect x="3" y="4" width="18" height="16" rx="5"/><path d="M12 8v8M8 12h8"/>',
  spark: '<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
  arrow: '<path d="M4 12h15m-6-6 6 6-6 6"/>',
  back: '<path d="m14 6-6 6 6 6"/>',
  down: '<path d="M12 4v16m-6-6 6 6 6-6"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  check: '<path d="m5 12 4 4L19 6"/>',
  circle: '<circle cx="12" cy="12" r="7"/>',
  shield: '<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/>',
  train: '<rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 10h14M9 3v7M15 3v7M8 21l2-3m6 3-2-3M8 14h1m6 0h1"/>',

function icon(name, small = false) {
  return `<svg class="icon${small ? ' icon-small' : ''}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    ${paths[name] || paths.spark}</svg>`;
}

function hydrate(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = icon(el.dataset.icon);
  });
}

function box(name, purple = false) {
  return `<span class="icon-box${purple ? ' icon-box-purple' : ''}">${icon(name)}</span>`;
}

function badge(text, name = '', light = false) {
  return `<span class="badge${light ? ' badge-light' : ''}">${name ? icon(name) : ''}${text}</span>`;
}

function button(text, action, type = '', full = true) {
  return `<button class="button ${type ? `button-${type}` : ''} ${full ? 'button-full' : ''}"
    data-action="${action}">${text}${icon('arrow', true)}</button>`;
}

function link(text, action, name = 'arrow') {
  return `<button class="text-button" data-action="${action}">${text}${icon(name, true)}</button>`;
}

function heading(title, subtitle, eyebrow = '') {
  return `<header class="page-heading"><div>
    ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
    <h1 tabindex="-1">${title}</h1><p>${subtitle}</p>
  </div></header>`;
}

function count(value, from = value) {
  return `<span data-count="${value}" data-from="${from}">${value.toLocaleString('en-GB')}</span>`;
}

function ring(value) {
  return `<div class="ring">
    <svg viewBox="0 0 74 74" role="img" aria-label="${value} percent ready">
      <circle class="ring-track" cx="37" cy="37" r="32"/>
      <circle class="ring-fill" cx="37" cy="37" r="32"
        stroke-dasharray="201.06" stroke-dashoffset="${201.06 * (1-value/100)}"/>

  </div>`;
}

  render();
  window.scrollTo(0,0);

}

function render() {
  const groups = {scan:'receipts',analysis:'receipts',reward:'receipts',payday:'salary',opportunity:'agent'};
  const active = groups[state.route] || state.route;
  const nav = navItems.map(([route,i,text]) =>
    `<button data-go="${route}" aria-label="${text}" ${route === active ? 'aria-current="page"' : ''}>
      <span class="nav-icon">${icon(i)}</span><span class="nav-label">${text}</span>
    </button>`
  ).join('');

  $('desktop-nav').innerHTML = nav;
  $('mobile-nav').innerHTML = nav;
  $('breadcrumb').textContent = navItems.find(item => item[0] === active)?.[2] || 'Overview';

  $('main').innerHTML = `<div class="page">${screens[state.route]()}</div>
    <div class="footer-link">${link('How estimates work','estimates','info')}</div>`;

  animateCounts();
}

function animateCounts() {
  $('main').querySelectorAll('[data-count]').forEach(el => {
    const value = Number(el.dataset.count);
    const from = Number(el.dataset.from);
    if (reduceMotion || from === value) return;
    const start = performance.now();
    function frame(now) {
      if (!el.isConnected) return;
      const p = Math.min((now-start)/750,1);
      el.textContent = Math.round(from + (value-from)*(1-Math.pow(1-p,3))).toLocaleString('en-GB');
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

const wait = ms => new Promise(resolve => setTimeout(resolve,ms));

async function startScan() {
  if (state.scanning) return;
  state.scanning = true;
  state.scanned = false;
  const token = ++scanToken;
  render();

  for (let i = 0; i < agentSteps.length; i++) {
    if (token !== scanToken || state.route !== 'scan') return;
    const row = $(`agent-${i}`);
    row.classList.add('agent-active');
    row.querySelector('.agent-status').textContent = 'Reviewing…';
    await wait(reduceMotion ? 150 : 600);
    if (token !== scanToken || state.route !== 'scan') return;
    row.classList.remove('agent-active');
    row.querySelector('.agent-status').innerHTML = icon('check',true);
  }

  state.scanning = false;

function openDialog(title,html) {
  if ($('overlay').hidden) focusBeforeDialog = document.activeElement;
  $('dialog-title').textContent = title;
  $('dialog-body').innerHTML = html;
  $('overlay').hidden = false;
  $('shell').inert = true;
  document.body.style.overflow = 'hidden';
  document.querySelector('.dialog').scrollTop = 0;
  document.querySelector('.close').focus();
}

function closeDialog(restore = true) {
  const wasOpen = !$('overlay').hidden;
  $('overlay').hidden = true;
  $('shell').inert = false;
  document.body.style.overflow = '';
  if (restore && wasOpen && focusBeforeDialog?.isConnected) focusBeforeDialog.focus();
}

function toast(text) {
  clearTimeout(toastTimer);
  $('toast').textContent = text;
  $('toast').classList.add('toast-visible');
  toastTimer = setTimeout(() => $('toast').classList.remove('toast-visible'),3500);
}

  if (action && !action.disabled) actions[action.dataset.action]?.();
});

document.addEventListener('change',event => {

  if (id === 'confirm-receipt') $('save-button').disabled = !event.target.checked || state.saved;
  if (id === 'draft-consent') $('draft-button').disabled = !event.target.checked;
  if (id === 'hotel-consent') $('hotel-button').disabled = !event.target.checked;

  }
});

$('overlay').addEventListener('click',event => {
  if (event.target === $('overlay')) closeDialog();
});

document.addEventListener('keydown',event => {
  if ($('overlay').hidden) return;
  if (event.key === 'Escape') closeDialog();

  if (event.key === 'Tab') {
    const nodes = [...$('overlay').querySelectorAll('button,input,select,a[href],textarea,summary')]
      .filter(el => !el.disabled && el.getClientRects().length);
    const first = nodes[0];
    const last = nodes[nodes.length-1];
    if (!first) return;

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});

hydrate();
render();
